<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF Converter</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="../css/ImgToPdf-style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
</head>
<body class="font-sans bg-gray-50 text-gray-900 py-10 px-5 antialiased">

<div class="max-w-[1000px] mx-auto">

    <header class="flex items-center gap-3 mb-6">
        <svg class="w-8 h-8 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <circle cx="10" cy="13" r="2"></circle>
            <path d="m20 17-1.89-1.89a1.5 1.5 0 0 0-2.12 0L14 17"></path>
        </svg>
        <h1 class="text-2xl font-semibold tracking-tight m-0">Image to PDF Converter</h1>
    </header>

    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 flex flex-wrap gap-3 items-center mb-6">
        <div class="relative overflow-hidden inline-block">
            <button class="bg-white text-gray-900 border border-gray-200 py-2.5 px-4 rounded-lg text-sm font-medium cursor-pointer transition-colors inline-flex items-center hover:bg-gray-100 disabled:opacity-60 disabled:cursor-not-allowed" id="upload-btn-ui">＋ Add Images</button>
            <input type="file" id="files" multiple accept="image/*,.heic,.heif" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
        </div>

        <select id="pageSize" class="custom-select appearance-none bg-white border border-gray-200 rounded-lg text-[13px] text-gray-900 py-2.5 pl-4 pr-9 focus:border-black outline-none cursor-pointer">
            <option value="A3">A3</option>
            <option value="A4" selected>A4</option>
            <option value="A5">A5</option>
            <option value="LETTER">Letter</option>
            <option value="LEGAL">Legal</option>
            <option value="ORIGINAL">Original Size</option>
        </select>

        <select id="orientation" class="custom-select appearance-none bg-white border border-gray-200 rounded-lg text-[13px] text-gray-900 py-2.5 pl-4 pr-9 focus:border-black outline-none cursor-pointer">
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
        </select>

        <select id="margin" class="custom-select appearance-none bg-white border border-gray-200 rounded-lg text-[13px] text-gray-900 py-2.5 pl-4 pr-9 focus:border-black outline-none cursor-pointer">
            <option value="0">No Margin</option>
            <option value="20">Small Margin</option>
            <option value="40">Large Margin</option>
        </select>

        <select id="fit" class="custom-select appearance-none bg-white border border-gray-200 rounded-lg text-[13px] text-gray-900 py-2.5 pl-4 pr-9 focus:border-black outline-none cursor-pointer">
            <option value="contain">Fit (Contain)</option>
            <option value="cover">Fill (Cover)</option>
        </select>

        <button class="bg-black text-white py-2.5 px-4 rounded-lg text-sm font-medium cursor-pointer transition-colors inline-flex items-center hover:bg-gray-800 disabled:opacity-60 disabled:cursor-not-allowed ml-auto border-none" id="preview-btn">
            Preview PDF
        </button>
    </div>

    <div class="mb-4 text-sm font-medium text-gray-500" id="status"></div>
    <div id="preview" class="grid grid-cols-[repeat(auto-fill,minmax(220px,1fr))] gap-5"></div>

</div>

<div class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden justify-center items-center z-[1000]" id="pdf-modal">
    <div class="bg-white w-[90%] max-w-[1100px] h-[90vh] rounded-xl shadow-2xl flex flex-col overflow-hidden">
        <div class="p-4 px-6 border-b border-gray-200 flex justify-between items-center">
            <h2 class="m-0 text-lg font-semibold">PDF Preview</h2>
            <div class="flex gap-3">
                <button class="bg-white text-gray-900 border border-gray-200 py-2.5 px-4 rounded-lg text-sm font-medium cursor-pointer transition-colors inline-flex items-center hover:bg-gray-100" id="close-pdf">Close</button>
                <button class="bg-black text-white py-2.5 px-4 rounded-lg text-sm font-medium cursor-pointer transition-colors inline-flex items-center hover:bg-gray-800 border-none" id="download-btn">Download PDF</button>
            </div>
        </div>
        <div class="flex-1 bg-gray-200 flex flex-col">
            <iframe id="pdf-frame" src="" class="w-full h-full border-none"></iframe>
        </div>
    </div>
</div>

<div class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden justify-center items-center z-[1000]" id="crop-modal">
    <div class="bg-white w-[90%] max-w-[800px] h-[85vh] rounded-xl shadow-2xl flex flex-col overflow-hidden">
        <div class="p-4 px-6 border-b border-gray-200 flex justify-between items-center">
            <h2 class="m-0 text-lg font-semibold">Crop Image</h2>
            <div class="flex gap-3">
                <button class="bg-white text-gray-900 border border-gray-200 py-2.5 px-4 rounded-lg text-sm font-medium cursor-pointer transition-colors inline-flex items-center hover:bg-gray-100" id="cancel-crop">Cancel</button>
                <button class="bg-black text-white py-2.5 px-4 rounded-lg text-sm font-medium cursor-pointer transition-colors inline-flex items-center hover:bg-gray-800 border-none" id="apply-crop">Apply Crop</button>
            </div>
        </div>
        <div class="flex-1 bg-gray-900 flex flex-col items-center justify-center p-6">
            <div class="max-w-full max-h-full">
                <img id="crop-image" src="" class="block max-w-full">
            </div>
        </div>
    </div>
</div>

<script src="../js/ImgToPdf-app.js"></script>

</body>
</html>
