<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolbox Hub - PDF & Utilities</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans bg-gray-50 text-gray-900 py-12 px-6 antialiased">

<div class="max-w-[900px] mx-auto">
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 pb-6 border-b border-gray-200">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-black text-white flex items-center justify-center shadow-sm">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-semibold tracking-tight m-0">Project Workspace</h1>
                <p class="text-sm text-gray-500 m-0">Select an application or tool to launch</p>
            </div>
        </div>

        <div class="relative w-full sm:w-72">
            <input type="text" id="search" placeholder="Search tools..." class="w-full bg-white border border-gray-200 rounded-lg text-sm py-2 px-3 pl-9 outline-none focus:border-black transition-colors">
            <svg class="w-4 h-4 text-gray-400 absolute left-3 top-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>
    </header>

    <div id="tool-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>

</div>

<script src="js/data.js"></script>
<script src="js/Home-app.js"></script>

</body>
</html>
