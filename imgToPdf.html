<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to PDF Converter</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    margin:30px;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    text-align:center;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

button{
    padding:10px 18px;
    cursor:pointer;
}

select{
    padding:8px;
}

#preview{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
}

.card{
    background:white;
    padding:10px;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    cursor:move;
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:5px;
}

.card p{
    font-size:12px;
    text-align:center;
    word-break:break-all;
}

.remove{
    width:100%;
    margin-top:8px;
    background:#d9534f;
    color:white;
    border:none;
    padding:8px;
}

.status{
    margin:20px 0;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h1>📄 Image to PDF Converter</h1>

<div class="controls">

<input type="file" id="files" multiple accept="image/*">

<select id="pageSize">
<option value="A4">A4</option>
<option value="LETTER">Letter</option>
<option value="ORIGINAL">Original Size</option>
</select>

<select id="orientation">
<option value="portrait">Portrait</option>
<option value="landscape">Landscape</option>
</select>

<select id="fit">
<option value="contain">Fit</option>
<option value="cover">Fill</option>
</select>

<button id="generate">
Generate PDF
</button>

</div>

<div class="status" id="status"></div>

<div id="preview"></div>

</div>

<script>

const preview=document.getElementById("preview");
const filesInput=document.getElementById("files");
const status=document.getElementById("status");

let images=[];

new Sortable(preview,{
    animation:150,
    onEnd(){
        const newOrder=[];
        [...preview.children].forEach(card=>{
            const index=card.dataset.index;
            newOrder.push(images[index]);
        });
        images=newOrder;
        refresh();
    }
});

filesInput.addEventListener("change",async(e)=>{

    for(const file of e.target.files){

        const url=URL.createObjectURL(file);

        images.push({
            file,
            url
        });

    }

    refresh();

});

function refresh(){

    preview.innerHTML="";

    images.forEach((img,i)=>{

        const div=document.createElement("div");
        div.className="card";
        div.dataset.index=i;

        div.innerHTML=`
            <img src="${img.url}">
            <p>${img.file.name}</p>
            <button class="remove">Remove</button>
        `;

        div.querySelector("button").onclick=()=>{
            images.splice(i,1);
            refresh();
        };

        preview.appendChild(div);

    });

}

function readFile(file){

    return new Promise(resolve=>{

        const reader=new FileReader();

        reader.onload=()=>resolve(reader.result);

        reader.readAsArrayBuffer(file);

    });

}

document.getElementById("generate").onclick=async()=>{

    if(images.length===0){

        alert("Select images first.");
        return;

    }

    status.innerHTML="Generating PDF...";

    const pdfDoc=await PDFLib.PDFDocument.create();

    const pageSize=document.getElementById("pageSize").value;
    const orientation=document.getElementById("orientation").value;
    const fit=document.getElementById("fit").value;

    let width,height;

    if(pageSize==="A4"){
        width=595;
        height=842;
    }
    else if(pageSize==="LETTER"){
        width=612;
        height=792;
    }

    for(const item of images){

        const bytes=await readFile(item.file);

        let image;

        if(item.file.type.includes("png"))
            image=await pdfDoc.embedPng(bytes);
        else
            image=await pdfDoc.embedJpg(bytes);

        let page;

        if(pageSize==="ORIGINAL"){

            page=pdfDoc.addPage([image.width,image.height]);

            page.drawImage(image,{
                x:0,
                y:0,
                width:image.width,
                height:image.height
            });

            continue;
        }

        if(orientation==="landscape"){
            page=pdfDoc.addPage([height,width]);
        }else{
            page=pdfDoc.addPage([width,height]);
        }

        const pw=page.getWidth();
        const ph=page.getHeight();

        const scaleContain=Math.min(
            pw/image.width,
            ph/image.height
        );

        const scaleCover=Math.max(
            pw/image.width,
            ph/image.height
        );

        const scale=fit==="cover"
            ?scaleCover
            :scaleContain;

        const iw=image.width*scale;
        const ih=image.height*scale;

        page.drawImage(image,{
            x:(pw-iw)/2,
            y:(ph-ih)/2,
            width:iw,
            height:ih
        });

    }

    const pdfBytes=await pdfDoc.save();

    const blob=new Blob([pdfBytes],{
        type:"application/pdf"
    });

    const link=document.createElement("a");

    link.href=URL.createObjectURL(blob);

    link.download="images.pdf";

    link.click();

    status.innerHTML="Done!";

};

</script>

</body>
</html>
